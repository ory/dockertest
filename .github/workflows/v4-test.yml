name: v4 Tests
on:
  push:
    branches:
      - v4/**
      - refactor-to-v4
  pull_request:
    paths:
      - "v4/**"
      - ".github/workflows/v4-test.yml"
      - ".golangci.yml"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: v4/go.sum

      - name: Run golangci-lint on v4
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: v4
          args: --config=../.golangci.yml

      - name: Run golangci-lint on examples
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: v4/examples
          args: --config=../../.golangci.yml

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        go-version: ["1.23", "1.24", "1.25"]
    services:
      docker:
        image: docker:dind
        options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: v4/go.sum

      - name: Install dependencies
        working-directory: v4
        run: go mod download

      - name: Run full tests with race detection
        working-directory: v4
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Run short tests
        working-directory: v4
        run: go test -v -short ./...

      - name: Verify no github.com/docker/docker dependency
        working-directory: v4
        run: |
          if go list -m all | grep -E '^github.com/docker/docker' | grep -v 'docker/go-'; then
            echo "ERROR: Found forbidden github.com/docker/docker dependency"
            exit 1
          fi
          echo "Dependency check passed: no github.com/docker/docker found"

      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.25'
        uses: codecov/codecov-action@v5
        with:
          files: ./v4/coverage.txt
          flags: v4
          name: v4-coverage
          fail_ci_if_error: false
