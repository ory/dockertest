name: Test CI
on:
  push:
    branches:
      - master
      - v3
      - v4
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make test
      - name: WriteGoList
        run: go list -json -deps ./... > go.list
      - name: Coveralls
        run: bash <(curl -s https://codecov.io/bash)
  native:
    # Daemon-free tests of the platform file locks and of Main's signal
    # handling on the platforms where their native implementations differ.
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go test -short -race ./internal/...
