name: Test CI
on:
  push:
    branches:
      - master
      - v3
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make test
      - name: WriteGoList
        run: go list -json -deps ./... > go.list
      - name: Coveralls
        run: bash <(curl -s https://codecov.io/bash)
